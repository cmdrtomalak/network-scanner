[package]
name = "netscanner"
version = "0.1.0"
edition = "2021"
description = "TUI network scanner with port scanning, connection monitoring, and packet sniffing"
license = "MIT"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
pcap = "2"
pnet = "0.35"
dns-lookup = "2"
socket2 = "0.5"

# System info (for connections)
sysinfo = "0.32"
netstat2 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"

# For hex display
hex = "0.4"

# Platform-specific
[target.'cfg(unix)'.dependencies]
libc = "0.2"
